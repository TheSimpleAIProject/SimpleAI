[package]
name = "simple-ai-frontend"
version = { workspace = true }
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router"]}
uuid = { workspace = true }
simple-ai-backend = { workspace = true }
simple-ai-macros = { workspace = true }
async-recursion = { version = "1.1" }
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
change-case = { version = "0.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
toml = { version = "0.9" }
anyhow = { version = "1.0" }
colored = { version = "3.0" }
regex = { version = "1.11" }
derive-new = { version = "0.7" }
derive_builder = { version = "0.20" }
chrono = { version = "0.4" }
tokio = { version = "1.43", features = ["rt"]}
